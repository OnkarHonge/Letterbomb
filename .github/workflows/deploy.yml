# Builds main and beta-two, then publishes one Pages site.
# / serves main. /beta-2/ serves the beta-two branch.
# /beta-1/ and /beta-3/ redirect to /. Those features are on main.
# Keep this file on main and on beta-two. A push to either rebuilds the site.
name: Deploy static content to Pages

on:
  push:
    branches: ['main', 'beta-two']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          path: main
      - name: Checkout beta-two
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: beta-two
          path: beta-two
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: lts/*
          cache: 'npm'
          cache-dependency-path: main/package-lock.json
      - name: Build main
        working-directory: main
        run: npm ci && npm run build
      - name: Build beta-two
        working-directory: beta-two
        run: npm ci && npm run build
      - name: Assemble site
        run: |
          mkdir -p site/beta-1 site/beta-2 site/beta-3
          cp -a main/dist/. site/
          cp -a beta-two/dist/. site/beta-2/
          cat > site/beta-1/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <title>Letterbomb</title>
          <link rel="canonical" href="../">
          <meta http-equiv="refresh" content="0; url=../">
          <script>location.replace("../")</script>
          </head>
          <body>
          <p><a href="../">Letterbomb</a></p>
          </body>
          </html>
          EOF
          cp site/beta-1/index.html site/beta-3/index.html
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
