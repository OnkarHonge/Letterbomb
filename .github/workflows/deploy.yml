# Builds main, beta-one, and beta-two, then publishes one Pages site.
# / serves main. /beta-1/ serves the beta-one branch. /beta-2/ serves the beta-two branch.
# Keep this file on every branch. A push to any of them rebuilds all three URLs.
name: Deploy static content to Pages

on:
  push:
    branches: ['main', 'beta-one', 'beta-two']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          path: main
      - name: Checkout beta-one
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: beta-one
          path: beta-one
      - name: Checkout beta-two
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: beta-two
          path: beta-two
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: lts/*
          cache: 'npm'
          cache-dependency-path: main/package-lock.json
      - name: Build main
        working-directory: main
        run: npm ci && npm run build
      - name: Build beta-one
        working-directory: beta-one
        run: npm ci && npm run build
      - name: Build beta-two
        working-directory: beta-two
        run: npm ci && npm run build
      - name: Assemble site
        run: |
          mkdir -p site/beta-1 site/beta-2
          cp -a main/dist/. site/
          cp -a beta-one/dist/. site/beta-1/
          cp -a beta-two/dist/. site/beta-2/
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
